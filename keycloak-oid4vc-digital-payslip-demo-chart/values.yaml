globals:
  image: &payslipDemoImage
    repository: ghcr.io/adorsys-gis/keycloak-oid4vc-digital-payslip-demo
    tag: '1.0.0'
    pullPolicy: IfNotPresent
  imagePullSecret: &imagePullSecret
    name: ghcr-pull-secret
  ingressHost: &ingressHost digitaler-gehaltsnachweis.eudi-adorsys.com
  tlsHosts: &tlsHosts
    - '*.eudi-adorsys.com'
    - 'eudi-adorsys.com'

app-template:
  global:
    fullnameOverride: keycloak-oid4vc-digital-payslip-demo
    namespaceOverride: payslip-demo
    labels:
      app: keycloak-oid4vc-digital-payslip-demo

  defaultPodOptions:
    imagePullSecrets:
      - *imagePullSecret

  controllers:
    main:
      enabled: true
      type: deployment
      replicas: 1
      containers:
        main:
          image: *payslipDemoImage
          env:
            VITE_API_BASE_URL: 'https://digitaler-gehaltsnachweis.eudi-adorsys.com'
            VITE_KEYCLOAK_URL: 'https://keycloak-demo.solutions.adorsys.com'
            VITE_KEYCLOAK_REALM: 'oid4vc-payslip'
            VITE_KEYCLOAK_CLIENT_ID: 'oid4vc-demo-public'
            VITE_OID4VC_DEFAULT_CREDENTIAL_CONFIGURATION_ID: 'PayslipCredential'
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

  service:
    main:
      enabled: true
      controller: main
      primary: true
      type: ClusterIP
      ports:
        http:
          enabled: true
          primary: true
          port: 8081
          protocol: HTTP
          targetPort: 8080

  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/hostname: *ingressHost
      hosts:
        - host: *ingressHost
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: 8081
      tls:
        - secretName: eudi-adorsys-tls
          hosts: *tlsHosts
